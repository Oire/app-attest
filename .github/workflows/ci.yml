name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, openssl, sodium
          coverage: none
          tools: composer

      # `composer install` from the committed lock, never `update`: Psalm is pinned to `dev-master`,
      # so `update` would analyze with whatever that branch happens to be today. Dependabot's lock
      # updates are what keep the dependencies current.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint and static analysis
        run: composer lint

      - name: Run tests
        run: composer test

      # Consumers install the package without `require-dev`, from an archive that leaves out what
      # `.gitattributes` marks `export-ignore`. Install it the same way and verify every genuine vector with
      # only that autoloader, so src/ cannot come to need a development dependency unnoticed.
      - name: Verify genuine vectors without development dependencies
        run: |
          mkdir "$RUNNER_TEMP/package"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/package"
          composer install --working-dir="$RUNNER_TEMP/package" --no-dev --prefer-dist --no-interaction --no-progress
          php -d auto_prepend_file="$RUNNER_TEMP/package/vendor/autoload.php" tests/verify-genuine-vectors.php
